<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>精选 DSH 插件</title>
<style>
  :root{--bg:#f6f8fb;--card:#fff;--text:#18222e;--muted:#5b6b7c;--line:#e3e9f0;--accent:#1d7fb4;--code:#eef4f9}
  @media (prefers-color-scheme:dark){:root{--bg:#0d141b;--card:#131e27;--text:#e8f1f8;--muted:#93a7b8;--line:#243442;--accent:#6fcdf5;--code:#0a1219}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 "Segoe UI",system-ui,-apple-system,"Microsoft YaHei",sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:56px 20px 80px}
  header h1{margin:0 0 8px;font-size:30px;letter-spacing:.5px}
  header p{margin:0;color:var(--muted)}
  .indexbox{margin:28px 0 36px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
  .indexbox h2{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--muted)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  code{background:var(--code);padding:6px 9px;border-radius:8px;font:13px/1.4 ui-monospace,Consolas,monospace;word-break:break-all}
  button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  .step{color:var(--muted);font-size:13px;margin-top:10px}
  .card{display:flex;gap:16px;padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:16px}
  .card img,.card .noicon{width:56px;height:56px;border-radius:12px;flex:none;object-fit:cover;background:var(--code);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--muted)}
  .card h3{margin:0 0 4px;font-size:17px}
  .card h3 small{color:var(--muted);font-size:13px;font-weight:400;margin-left:6px}
  .card p{margin:0 0 10px;color:var(--muted);font-size:14px}
  .meta{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
  .tag{border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .actions{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;align-items:center}
  .status{color:var(--muted);font-size:13px;padding:24px 0}
  footer{margin-top:40px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>精选 DSH 插件</h1>
    <p>由 cuiyuan605 维护的 DeepSeek Harness 插件精选，同时也是一个插件市场索引，可直接加进 DSH 的「发现」。</p>
  </header>

  <section class="indexbox">
    <h2>索引源地址</h2>
    <div class="row">
      <code id="index-url">https://cuiyuan605.github.io/dsh-plugin-picks/index.json</code>
      <button onclick="copyText(document.getElementById('index-url').textContent)">复制</button>
    </div>
    <div class="step">用法：插件 → 发现 → 添加索引源，粘贴上面的地址（需先开启「自定义插件市场」）。</div>
  </section>

  <main id="list"><div class="status">正在读取索引…</div></main>

  <footer>
    本页直接从 <code>index.json</code> 渲染，新增插件只需更新索引即可。索引格式为 DSH plugin market index format 1。
  </footer>
</div>
<script>
const listEl = document.getElementById('list');

function textOf(value) {
  if (value == null) return '';
  if (typeof value === 'string') return value;
  return value.zh || value.en || Object.values(value)[0] || '';
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (key === 'text') node.textContent = value;
    else if (key === 'className') node.className = value;
    else node.setAttribute(key, value);
  }
  for (const child of children || []) if (child) node.appendChild(child);
  return node;
}

function renderCard(plugin) {
  const version = plugin.versions && plugin.versions[0];
  const title = textOf(plugin.title) || plugin.name;
  const description = textOf(plugin.description);
  const repo = plugin.repository && plugin.repository.url ? plugin.repository.url : plugin.homepage;
  const npm = version && version.source && version.source.type === 'npm'
    ? 'https://www.npmjs.com/package/' + plugin.name
    : null;
  const install = "dsh plugin --profile web add '" + plugin.name + "'";

  const icon = plugin.icon
    ? el('img', { src: plugin.icon, alt: title })
    : el('div', { className: 'noicon', text: title.slice(0, 1) });

  const actions = [];
  if (repo) actions.push(el('a', { href: repo, target: '_blank', rel: 'noreferrer', text: '源码' }));
  if (npm) actions.push(el('a', { href: npm, target: '_blank', rel: 'noreferrer', text: 'npm' }));
  const copyButton = el('button', { type: 'button', text: '复制安装命令' });
  copyButton.addEventListener('click', () => copyText(install));
  actions.push(copyButton);

  const meta = [el('span', { className: 'tag', text: 'v' + (version ? version.version : '?') })];
  for (const keyword of (plugin.keywords || []).slice(0, 4)) meta.push(el('span', { className: 'tag', text: keyword }));

  return el('article', { className: 'card' }, [
    icon,
    el('div', {}, [
      el('h3', {}, [document.createTextNode(title), el('small', { text: plugin.name })]),
      description ? el('p', { text: description }) : null,
      el('div', { className: 'meta' }, meta),
      el('div', { className: 'actions' }, actions),
    ]),
  ]);
}

function render(index) {
  listEl.textContent = '';
  const plugins = Array.isArray(index.plugins) ? index.plugins : [];
  if (plugins.length === 0) {
    listEl.appendChild(el('div', { className: 'status', text: '索引里还没有插件。' }));
    return;
  }
  for (const plugin of plugins) listEl.appendChild(renderCard(plugin));
}

fetch('./index.json', { cache: 'no-store' })
  .then((response) => response.ok ? response.json() : Promise.reject(new Error('HTTP ' + response.status)))
  .then(render)
  .catch((error) => {
    listEl.textContent = '';
    listEl.appendChild(el('div', { className: 'status', text: '读取索引失败：' + error.message + '，可以直接打开 index.json 查看。' }));
  });

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(flash, () => fallback(text));
  } else fallback(text);
}
function fallback(text) {
  const area = document.createElement('textarea');
  area.value = text;
  document.body.appendChild(area);
  area.select();
  document.execCommand('copy');
  area.remove();
  flash();
}
function flash() {
  const tip = document.createElement('div');
  tip.textContent = '已复制';
  tip.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d7fb4;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;z-index:9';
  document.body.appendChild(tip);
  setTimeout(() => tip.remove(), 1200);
}
</script>
</body>
</html>
